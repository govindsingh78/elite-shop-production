name: Deploy to AWS EC2

on:
  push:
    branches: [elite-production]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The website is built here rather than on the server: installing and building it needs more memory
      # than the server has, and doing it there froze the server. Only the finished files are copied over.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e-shop-frontend/package-lock.json

      - name: Build the website
        working-directory: e-shop-frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          tar -czf ../website.tgz dist

      - name: Copy the website to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: website.tgz
          target: /tmp/elitezaar-deploy

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /var/www/html/elite-shop-production
            # PHP (www-data) and sudo commands can take over these folders; git must be able to write its own folder
            # and rewrite the files it tracks in storage and bootstrap/cache.
            sudo chown -R ubuntu:ubuntu .git
            sudo chown -R ubuntu:www-data e-street-backend/storage e-street-backend/bootstrap/cache
            # deploy.sh makes these folders 775, which git would otherwise see as changed files on every deploy.
            git config core.fileMode false
            git fetch origin elite-production
            git reset --hard origin/elite-production
            bash deploy.sh /tmp/elitezaar-deploy/website.tgz
